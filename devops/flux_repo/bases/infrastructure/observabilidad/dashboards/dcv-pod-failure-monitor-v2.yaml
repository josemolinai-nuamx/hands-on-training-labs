apiVersion: v1
kind: ConfigMap
metadata:
  name: dcv-pod-failure-monitor-v2
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
  dcv-pod-failure-monitor-v2.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "panels": [
        {
          "title": "Pod Status Overview",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"falla-test\", phase=\"Running\"})",
              "legendFormat": "Running",
              "refId": "A"
            },
            {
              "expr": "count(kube_pod_status_phase{namespace=\"falla-test\", phase=\"Failed\"})",
              "legendFormat": "Failed",
              "refId": "B"
            },
            {
              "expr": "count(kube_pod_status_phase{namespace=\"falla-test\", phase=\"Pending\"})",
              "legendFormat": "Pending",
              "refId": "C"
            },
            {
              "expr": "count(kube_pod_status_phase{namespace=\"falla-test\", phase=\"Unknown\"})",
              "legendFormat": "Unknown",
              "refId": "D"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            }
          }
        },
        {
          "title": "CrashLoopBackOff Restarts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"falla-test\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Pod Phase Timeline",
          "type": "state-timeline",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=\"falla-test\"}",
              "legendFormat": "{{pod}} - {{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Error Logs Counter",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "count_over_time({namespace=\"falla-test\"} |= \"ERROR\" [5m])",
              "legendFormat": "ERROR",
              "refId": "A"
            },
            {
              "expr": "count_over_time({namespace=\"falla-test\"} |= \"CRITICAL\" [5m])",
              "legendFormat": "CRITICAL",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Memory Usage %",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "container_memory_usage_bytes{namespace=\"falla-test\"} / container_spec_memory_limit_bytes{namespace=\"falla-test\"} * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "title": "Container Readiness",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "kube_pod_container_status_ready{namespace=\"falla-test\"}",
              "format": "table",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Deployment Health",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"falla-test\"}",
              "legendFormat": "Available",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_status_replicas_unavailable{namespace=\"falla-test\"}",
              "legendFormat": "Unavailable",
              "refId": "B"
            }
          ]
        }
      ],
      "schemaVersion": 42,
      "tags": ["kubernetes", "pods", "monitoring"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "query": "falla-test"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "DCV Pod Failure Monitor v2",
      "uid": "dcv-pod-failure-monitor-v2",
      "version": 1
    }