apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-lab-reader
  namespace: lab-seguridad
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-lab-reader
  namespace: lab-seguridad
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-lab-reader
  namespace: lab-seguridad
subjects:
- kind: ServiceAccount
  name: sa-lab-reader
  namespace: lab-seguridad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: role-lab-reader
